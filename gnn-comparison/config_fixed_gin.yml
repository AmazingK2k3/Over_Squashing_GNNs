model:
  - GIN
device:
  - cuda
batch_size:
  - 32
learning_rate:
  - 0.001
classifier_epochs:          
  - 1000
hidden_units:
  - [128, 128, 128, 128, 128] 
optimizer:                 
  - Adam
scheduler:                 
  - null
loss:                        
  - MulticlassClassificationLoss
train_eps:
  - True
l2:                         
  - 0.0001
aggregation:
  - sum
gradient_clipping:         
  - null
dropout:
  - 0.5
early_stopper:            
  -
    class: Patience
    args:
      patience: 500
      use_loss: False
shuffle:                   
  - True
resume:                   
  - False
rewire_all_layers:
  - 0 # 0 means last layer rewiring
rewired_layer:
  - 2 # 1 means rewiring happens in last layer
 # 2 means rewiring happens in penultimate layer
debug:
  - 1