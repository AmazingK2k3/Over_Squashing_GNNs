model:
  - DGCNN
device:
  - cuda
batch_size:
  - 16
dense_dim:
  - 128
k:
  - 0.9
learning_rate:
  - 0.0001
classifier_epochs:
  - 1000
optimizer:
  - Adam
scheduler:
  - null
loss:
  - MulticlassClassificationLoss
gradient_clipping:
  - null
early_stopper:
  -
    class: Patience
    args:
      patience: 500
      use_loss: False
shuffle:
  - True
l2:
  - 0.0001
embedding_dim:
  - 64
num_layers:
  - 5
rewire_for_all_layers:
  - 0 # 1 means rewire all layers
skip_model_selection:
  - 1 
rewired_layer:
  - 2 # 1 means rewiring happens in last layer
 # - 2 # 2 means rewiring happens in penultimate layer
debug:
  - 1 # 1 is true