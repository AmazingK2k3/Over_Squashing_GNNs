model:
  - GraphSAGE
device:
  - cuda
batch_size:
  - 16
hidden_units:
  - 128
learning_rate:
  - 0.001
l2:
  - 0.0001
classifier_epochs:
  - 1000
optimizer:
  - Adam
scheduler:
  - null
loss:
  - MulticlassClassificationLoss
gradient_clipping:
  - null
early_stopper:
  -
    class: Patience
    args:
      patience: 400
      use_loss: False
shuffle:
  - True
num_layers:
  - 5 # changed: 5 ----> 3
dim_embedding:
  - 64
aggregation:
  - mean 
rewire_for_all_layers:
  - 0 # 1 means rewire all layers
skip_model_selection:
  - 1 
rewired_layer:
  - 1 # 1 means rewiring happens in last layer
 # - 2 # 2 means rewiring happens in penultimate layer

debug:
  - 1 # 1 is true